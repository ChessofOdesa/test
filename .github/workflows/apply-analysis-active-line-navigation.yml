name: Apply Analysis active-line navigation

on:
  push:
    branches:
      - fix/analysis-active-line-navigation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/analysis-active-line-navigation

      - name: Apply targeted navigation patch
        run: node scripts/apply-analysis-active-line-navigation.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisCenter.tsx
          git commit -m "use active-line navigation in Analysis footer"
          git push
