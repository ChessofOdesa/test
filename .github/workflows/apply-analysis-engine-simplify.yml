name: Apply Analysis engine simplification

on:
  push:
    branches:
      - feature/analysis-engine-simplify

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-engine-simplify

      - name: Repair one-time patch script quoting
        run: node scripts/fix-analysis-engine-simplify-script.mjs

      - name: Apply targeted simplification patch
        run: node scripts/apply-analysis-engine-simplify.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisCenter.tsx src/styles/analysis-panel-professional.css src/test/analysis.smoke.test.tsx
          git commit -m "simplify Analysis engine panel and board badges"
          git push
