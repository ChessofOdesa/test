name: Apply Analysis tree FEN and promotion fix

on:
  push:
    branches:
      - fix/analysis-tree-fen-promotion-impl2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/analysis-tree-fen-promotion-impl2

      - name: Apply targeted patch
        run: node scripts/apply-analysis-tree-fen-promotion.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/analysis/model.tsx src/features/analysis/AnalysisMoveTree.tsx
          git commit -m "fix custom FEN numbering and nested variation promotion"
          git push
