name: Apply Analysis evaluation graph

on:
  push:
    branches:
      - feature/analysis-evaluation-graph

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-evaluation-graph

      - name: Apply targeted integration patch
        run: node scripts/apply-analysis-evaluation-graph.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisCenter.tsx
          git commit -m "integrate evaluation graph into Analysis overview"
          git push
