name: Apply Analysis best-move preview

on:
  push:
    branches:
      - feature/analysis-best-move-preview

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-best-move-preview

      - name: Apply targeted preview patch
        run: node scripts/apply-analysis-best-move-preview.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisCenter.tsx src/features/analysis/AnalysisMoveTree.tsx
          git commit -m "preview reviewed best line from move inspector"
          git push
