name: Apply Analysis page screenshot redesign

on:
  push:
    branches:
      - feature/analysis-page-screenshot-layout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-page-screenshot-layout

      - name: Apply targeted patch
        run: node scripts/apply-analysis-page-screenshot.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisCenter.tsx src/test/analysis.smoke.test.tsx
          git commit -m "redesign Analysis page around compact engine workspace"
          git push
