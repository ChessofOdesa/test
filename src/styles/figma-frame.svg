<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#1A1A1A" rx="12" />

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="56" fill="#2D2D2D" rx="8" />
  <text x="48" y="58" font-family="Montserrat, Roboto Condensed, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">♞ Chess.od</text>
  <g transform="translate(900,38)" fill="#CCCCCC" font-family="Open Sans, sans-serif" font-size="14">
    <text x="0" y="4">Грати</text>
    <text x="64" y="4">Задачі</text>
    <text x="144" y="4">Навчання</text>
  </g>

  <!-- Hero card -->
  <rect x="40" y="96" width="1120" height="420" rx="12" fill="#2D2D2D" stroke="#3D3D3D" />

  <!-- Left column text -->
  <text x="84" y="160" font-family="Montserrat, Roboto Condensed, sans-serif" font-size="36" fill="#FFFFFF" font-weight="700">Готові до партії?</text>
  <text x="84" y="200" font-family="Open Sans, sans-serif" font-size="16" fill="#CCCCCC">Швидкий доступ до матчів, задач та уроків.</text>

  <!-- CTA buttons -->
  <rect x="84" y="230" width="220" height="48" rx="6" fill="#81B64C" />
  <text x="120" y="260" font-family="Open Sans, sans-serif" font-size="14" fill="#000000" font-weight="700">▶ ГРАТИ ЗАРАЗ</text>
  <rect x="320" y="230" width="180" height="48" rx="6" fill="transparent" stroke="#3D3D3D" />
  <text x="360" y="260" font-family="Open Sans, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Навчитись грати</text>

  <!-- Right column chessboard placeholder -->
  <rect x="700" y="120" width="360" height="360" rx="8" fill="#F0D9B5" stroke="#B58863" />
  <!-- draw simple board grid -->
  <g>
    <!-- 8x8 squares -->
    <!-- We'll draw alternating dark squares over the light board -->
    <!-- square size 45 -->
    <!-- top-left at 700,120 -->
    <g fill="#B58863">
      <!-- draw dark squares for a simple pattern -->
      <!-- Row 1 -->
      <rect x="745" y="120" width="45" height="45" />
      <rect x="835" y="120" width="45" height="45" />
      <rect x="925" y="120" width="45" height="45" />
      <rect x="1015" y="120" width="45" height="45" />
      <!-- Row 2 -->
      <rect x="700" y="165" width="45" height="45" />
      <rect x="790" y="165" width="45" height="45" />
      <rect x="880" y="165" width="45" height="45" />
      <rect x="970" y="165" width="45" height="45" />
      <!-- Row 3 -->
      <rect x="745" y="210" width="45" height="45" />
      <rect x="835" y="210" width="45" height="45" />
      <rect x="925" y="210" width="45" height="45" />
      <rect x="1015" y="210" width="45" height="45" />
      <!-- Row 4 -->
      <rect x="700" y="255" width="45" height="45" />
      <rect x="790" y="255" width="45" height="45" />
      <rect x="880" y="255" width="45" height="45" />
      <rect x="970" y="255" width="45" height="45" />
      <!-- Row 5 -->
      <rect x="745" y="300" width="45" height="45" />
      <rect x="835" y="300" width="45" height="45" />
      <rect x="925" y="300" width="45" height="45" />
      <rect x="1015" y="300" width="45" height="45" />
      <!-- Row 6 -->
      <rect x="700" y="345" width="45" height="45" />
      <rect x="790" y="345" width="45" height="45" />
      <rect x="880" y="345" width="45" height="45" />
      <rect x="970" y="345" width="45" height="45" />
      <!-- Row 7 -->
      <rect x="745" y="390" width="45" height="45" />
      <rect x="835" y="390" width="45" height="45" />
      <rect x="925" y="390" width="45" height="45" />
      <rect x="1015" y="390" width="45" height="45" />
      <!-- Row 8 -->
      <rect x="700" y="435" width="45" height="45" />
      <rect x="790" y="435" width="45" height="45" />
      <rect x="880" y="435" width="45" height="45" />
      <rect x="970" y="435" width="45" height="45" />
    </g>
  </g>

  <!-- Footer small -->
  <text x="84" y="540" font-family="Open Sans, sans-serif" font-size="12" fill="#CCCCCC">Токени: background #1A1A1A • accent #7FA650 • cta #81B64C</text>

</svg>
